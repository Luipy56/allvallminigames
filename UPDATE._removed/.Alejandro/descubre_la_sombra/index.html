<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js"></script>
    <title>Descubre la sombra</title>
</head>
<body data-total-levels="7">
    <div class="container">
        <canvas id="draw-canvas"></canvas>
        <div class="sub-container">
            <div class="shadow-container">
                <img src="img/sombra1.png" alt="sombra1" class="shadow-image">
            </div>
        </div>
        <div class="sub-container">
            <div class="image-container">
                <img src="img/correcto1.png" alt="correcto1" class="image-option" data-correct="true">
                <img src="img/alternativa1.png" alt="alternativa1" class="image-option" data-correct="false">
            </div>
        </div>
    </div>
    <div class="instructions-video-container">
        <video class="instructions-video" autoplay loop muted playsinline>
            <source src="videos/instrucciones.mp4" type="video/mp4">
        </video>
    </div>
    <!-- Volver al indice -->
    <a href="#" id="return-arrow">
        <img src="img/return.png" alt="return">
    </a>
    <div id="lose-gif" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="error-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
    </div>
    <div id="win-gif" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="success-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
        </svg>
    </div>
</body>
</html>
