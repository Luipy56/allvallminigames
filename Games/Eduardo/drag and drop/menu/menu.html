<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Jocs de Memòria Esportiva</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 40px;
        }

        .button {
            display: block;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            font-size: 24px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .button:hover {
            background-color: #34495e;
        }

        #home {
            position: fixed;
            top: 25px;
            left: 25px;
            height: 75px;
            width: 75px;
            border-radius: 100%;
            border: 3px solid #3A3A3A;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            opacity: 0.5;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #home:hover {
            transition: 1s ease-in-out;
            transform: rotate(360deg);
            opacity: 1;
        }

        #home svg {
            width: 28px;
            height: 28px;
        }
    </style>
</head>

      </button>
    </a>
    <div class="container">

</html>
