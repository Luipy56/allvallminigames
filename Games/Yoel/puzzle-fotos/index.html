<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle de fotos — Completa la imagen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="../../../index.html#page3">
    <button type="button" id="home" aria-label="Enrere">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="currentColor" d="M261.56 101.28a8 8 0 0 0-11.06 0L66.4 277.15a8 8 0 0 0-2.47 5.79L63.9 448a32 32 0 0 0 32 32H192a16 16 0 0 0 16-16V328a8 8 0 0 1 8-8h80a8 8 0 0 1 8 8v136a16 16 0 0 0 16 16h96.06a32 32 0 0 0 32-32V282.94a8 8 0 0 0-2.47-5.79Z"/><path fill="currentColor" d="m490.91 244.15l-74.8-71.56V64a16 16 0 0 0-16-16h-48a16 16 0 0 0-16 16v32l-57.92-55.38C272.77 35.14 264.71 32 256 32c-8.68 0-16.72 3.14-22.14 8.63l-212.7 203.5c-6.22 6-7 15.87-1.34 22.37A16 16 0 0 0 43 267.56L250.5 69.28a8 8 0 0 1 11.06 0l207.52 198.28a16 16 0 0 0 22.59-.44c6.14-6.36 5.63-16.86-.76-22.97"/></svg>
    </button>
  </a>
  <div class="app">
    <main class="main">
      <div class="game-box">
        <button type="button" class="btn btn-change-image" id="changeImageBtn" aria-label="Cambiar Foto">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="btn-change-image-icon" aria-hidden="true"><path fill="currentColor" d="M463.5 224H472c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2s-19.3-1.7-26.2 5.2L413.4 96.6c-87.6-86.5-228.7-86.2-316 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2s12.5 14.8 22.2 14.8H463.5z"/></svg>
        </button>
        <div class="image-loading" id="imageLoading" hidden aria-live="polite">
          <div class="image-loading-spinner" role="status" aria-label="Cargando imágenes"></div>
        </div>
        <div class="game-layout" id="piecesWrap" aria-label="Puzzle y piezas">
        <div class="pieces-top" id="piecesTop" aria-label="Piezas arriba"></div>
        <div class="pieces-left" id="piecesLeft" aria-label="Piezas a la izquierda"></div>
        <section class="board" id="board" aria-label="Zona del puzzle">
          <div class="board-bg" id="boardBg" aria-hidden="true"></div>
          <!-- 2x4 drop slots, filled by JS -->
        </section>
        <div class="pieces-right" id="piecesRight" aria-label="Piezas a la derecha"></div>
        <div class="pieces-bottom" id="piecesBottom" aria-label="Piezas abajo"></div>
        </div>
      </div>
    </main>
    <footer class="watermark"><a href="https://ldeluipy.es" target="_blank" rel="noopener noreferrer">ldeluipy</a></footer>
  </div>

  <!-- Modal layer: no alerts, always modals -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal" id="modal">
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-text" id="modalText"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="modalBtn">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
