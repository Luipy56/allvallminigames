<div id="pantallaInicio">
  <h2>Aprendemos dónde viven</h2>

  <div class="ejemplo-container">
    <div class="ejemplo"><img src="img/leon_selva.jpg" alt="León en la selva"></div>
    <div class="ejemplo"><img src="img/delfin_mar.jpg" alt="Delfín en el mar"></div>
    <div class="ejemplo"><img src="img/oso_bosque.jpg" alt="Oso en el bosque"></div>
  </div>

  <button id="btnEmpezar">Empezar</button>
</div>


<div id="pantallaJuego" class="hidden">

  <h2>¿Dónde vive?</h2>

  <div class="zona-animal">
    <img id="animal" draggable="true" alt="Animal">
  </div>

  <div class="habitats">
    <div class="habitat" data-habitat="selva">
        <img src="img/selva.jpg" alt="Selva">
    </div>
    <div class="habitat" data-habitat="mar">
        <img src="img/mar.jpg" alt="Mar">
    </div>
    <div class="habitat" data-habitat="bosque">
        <img src="img/bosque.jpg" alt="Bosque">
    </div>
  </div>

  <div id="victoria" class="hidden">
    <img src="victoria.gif" alt="Victoria">
  </div>
  <div id="error" class="hidden">
    <img src="error.gif" alt="Error">
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
