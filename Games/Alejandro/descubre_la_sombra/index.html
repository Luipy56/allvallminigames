<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js"></script>
    <title>Descubre la sombra</title>
</head>
<body>
    <div class="container win">
        <canvas id="draw-canvas"></canvas>
        <div class="sub-container">
            <h1 class="game-title">¿Qué animal es?</h1>
            <div class="shadow-container">
                <img src="img/sombra1.png" alt="sombra1" class="shadow-image">
            </div>
        </div>
        <div class="sub-container">
            <div class="image-container">
                <img src="img/correcto1.png" alt="correcto1" class="image-option" data-correct="true">
                <img src="img/alternativa1.png" alt="alternativa1" class="image-option" data-correct="false">
            </div>
        </div>
    </div>
    <!-- Volver al indice -->
    <a href="../../../index.html" id="return-arrow">
        <img src="img/return.png" alt="return">
    </a>
    <img src="img/lose.gif" alt="lose" id="lose-gif" class="lose-gif">
    <img src="img/win.gif" alt="win" id="win-gif">
    <button class="button" id="next-level-button">
        <img src="img/arrow.png" alt="arrow">
    </button>
    <button class="button" id="restart-button">
        <img src="img/restart.png" alt="restart">
    </button>
</body>
</html>
